<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="3" fill="#0d0d09"/>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- grid lines -->
  <g filter="url(#glow)" stroke="#e6db74" fill="none">
    <rect x="4" y="4" width="24" height="24" stroke-width="1.5"/>
    <line x1="12" y1="4"  x2="12" y2="28" stroke-width="0.6"/>
    <line x1="20" y1="4"  x2="20" y2="28" stroke-width="0.6"/>
    <line x1="4"  y1="12" x2="28" y2="12" stroke-width="0.6"/>
    <line x1="4"  y1="20" x2="28" y2="20" stroke-width="0.6"/>
  </g>
  <!-- anti-diagonal: top-right → center → bottom-left -->
  <g filter="url(#glow)" fill="#e6db74">
    <rect x="20.75" y="4.75"  width="6.5" height="6.5"/>
    <rect x="12.75" y="12.75" width="6.5" height="6.5"/>
    <rect x="4.75"  y="20.75" width="6.5" height="6.5"/>
  </g>
</svg>
