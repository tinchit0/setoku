services:
  backend:
    build: ./backend
    container_name: sudoku-backend
    environment:
      SUDOKU_DB_PATH: /data/sudoku.db
    volumes:
      - sudoku-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sudoku-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sudoku-data:
